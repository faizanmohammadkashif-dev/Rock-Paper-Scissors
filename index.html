<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <div>
        <h1>Lets Play!!!</h1>

        <button onclick="play('Rock')"><i class="fa-solid fa-hand-back-fist"></i></button>

        <button onclick="play('Paper')"><i class="fa-solid fa-hand"></i></button>

        <button onclick="play('Scissors')"><i class="fa-solid fa-hand-peace"></i></button>

        <p id="userResult"></p>

        <p id="computerResult"></p>

        <p id="result"></p>

    </div>

    <script src="./main.js"></script>
</body>
</html>
